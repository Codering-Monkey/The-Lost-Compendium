<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>The Lost Compendium - All Spells</title>
		<link href="../styles.css" rel="stylesheet" type="text/css">
	</head>
	<body>
		<script src="../scripts/all_spells.js" type="module"></script>
		<script src="../scripts/script.js" type="module"></script>
		<script id="replace_with_navbar" src="../navbar/nav.js" type="module"></script>
		<div class="tiles" style="--columns:8">
			<div style="grid-column: span 4" class="container">
				<label for="name">Name</label>
				<input type="text" id="name" style="float: right; width: 90%; height: 19px">
			</div>
			<div class="container" style="grid-column: span 2">
				<p>Min Level</p>
				<select id="min_level" style="float: right">
					<option>All</option>
					<option value="0">Cantrip</option>
					<option>1</option>
					<option>2</option>
					<option>3</option>
					<option>4</option>
					<option>5</option>
					<option>6</option>
					<option>7</option>
					<option>8</option>
					<option>9</option>
				</select>
			</div>
			<div class="container" style="grid-column: span 2">
				<p>Max Level</p>
				<select id="max_level" style="float: right">
					<option>All</option>
					<option value="0">Cantrip</option>
					<option>1</option>
					<option>2</option>
					<option>3</option>
					<option>4</option>
					<option>5</option>
					<option>6</option>
					<option>7</option>
					<option>8</option>
					<option>9</option>
				</select>
			</div>
			<div class="container" style="grid-column: span 4">
				<p>School</p>
				<select id="school" style="float: right">
					<option>All</option>
					<option>Abjuration</option>
					<option>Conjuration</option>
					<option>Divination</option>
					<option>Enchantment</option>
					<option>Evocation</option>
					<option>Illusion</option>
					<option>Necromancy</option>
					<option>Transmutation</option>
				</select>
			</div>
			<div class="container" style="grid-column: span 2">
				<p>Min Range</p>
				<select id="min_range" style="float: right">
					<option>All</option>
					<option>Self</option>
					<option>Touch</option>
					<option value="10">10ft / 3m</option>
					<option value="30">30ft / 9m</option>
					<option value="60">60ft / 18m</option>
					<option value="90">90ft / 27m</option>
					<option value="120">120ft / 36m</option>
					<option value="150">150ft / 42m</option>
				</select>
			</div>
			<div class="container" style="grid-column: span 2">
				<p>Max Range</p>
				<select id="max_range" style="float: right">
					<option>All</option>
					<option>Self</option>
					<option>Touch</option>
					<option value="10">10ft / 3m</option>
					<option value="30">30ft / 9m</option>
					<option value="60">60ft / 18m</option>
					<option value="90">90ft / 27m</option>
					<option value="120">120ft / 36m</option>
					<option value="150">150ft / 42m</option>
				</select>
			</div>
			<div class="container">
				<p>Bard</p>
				<input type="checkbox" id="bard">
			</div>
			<div class="container">
				<p>Cleric</p>
				<input type="checkbox" id="cleric">
			</div>
			<div class="container">
				<p>Druid</p>
				<input type="checkbox" id="druid">
			</div>
			<div class="container">
				<p>Paladin</p>
				<input type="checkbox" id="paladin">
			</div>
			<div class="container">
				<p>Ranger</p>
				<input type="checkbox" id="ranger">
			</div>
			<div class="container">
				<p>Sorcerer</p>
				<input type="checkbox" id="sorcerer">
			</div>
			<div class="container">
				<p>Warlock</p>
				<input type="checkbox" id="warlock">
			</div>
			<div class="container">
				<p>Wizard</p>
				<input type="checkbox" id="wizard">
			</div>
		</div>
		<div style="height: 93vh">
			<div id="spell_box" class="scrollbox" style="--above: 256px; margin-left: 16px; width: calc(100% - 16px); display: grid; grid-template-columns: 1fr 1fr; align-content: start">
				<div class="monster-row-short">
					<div style="border-color: var(--shadow)">Name</div>
					<div style="border-color: var(--shadow)">Level</div>
					<div style="border-color: var(--shadow)">School</div>
					<div style="border-color: var(--shadow)">Classes</div>
				</div><div class="monster-row-short">
					<div style="border-color: var(--shadow)">Name</div>
					<div style="border-color: var(--shadow)">Level</div>
					<div style="border-color: var(--shadow)">School</div>
					<div style="border-color: var(--shadow)">Classes</div>
				</div>
			</div>
		</div>
	</body>
</html>
